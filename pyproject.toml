[project]
name = "inkobold"
version = "0.1.0"
description = "GPU-accelerated layered drawing (GTK4; libinput/libwacom on Linux)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PyOpenGL>=3.1.7",
  "Pillow>=10.0",
]

[project.scripts]
inkobold = "inkobold.__main__:main"

[tool.setuptools.packages.find]
include = ["inkobold*"]
